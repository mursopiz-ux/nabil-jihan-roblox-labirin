name: Build & Publish Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build web game
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Bundle compiled game into Android assets
        run: |
          rm -rf android/app/src/main/assets/*
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          mkdir -p android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NabilKayanaJihan-MazeAdventure.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NabilKayanaJihan-MazeAdventure-APK
          path: NabilKayanaJihan-MazeAdventure.apk

      - name: Publish direct .APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Nabil Kayana & Jihan: Maze Adventure (Android APK)"
          body: |
            Unduh file **NabilKayanaJihan-MazeAdventure.apk** langsung di bagian **Assets** di bawah ini (tidak perlu ekstrak ZIP).
          files: NabilKayanaJihan-MazeAdventure.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
